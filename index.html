<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14201c">
<title>منيو رقمي | مطعم دجلة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#101a17;--bg2:#17251f;--ink:#f3efe6;--mut:#a9b5ae;--gold:#c9a45c;--line:rgba(255,255,255,.1);--glass:rgba(255,255,255,.07);--ok:#6fbf8e;--bad:#d4736a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#24392f 0,transparent 60%),var(--bg);color:var(--ink);min-height:100vh;padding-bottom:90px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-radius:20px}
header.hero{padding:34px 0 18px;text-align:center}
.logo{width:76px;height:76px;margin:0 auto 12px;border-radius:24px;display:grid;place-items:center;font-family:'Reem Kufi';font-size:38px;color:#1a1408;background:linear-gradient(145deg,#e6c57e,#b08a43);box-shadow:0 10px 30px rgba(201,164,92,.25)}
h1{font-family:'Reem Kufi';font-size:30px;margin:0 0 4px;letter-spacing:.3px}
.sub{color:var(--mut);font-size:14px}
.info{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.chip{padding:7px 13px;border-radius:999px;font-size:13px;color:var(--mut)}
.search{display:flex;align-items:center;gap:10px;padding:12px 16px;margin:14px 0 6px}
.search input{flex:1;background:none;border:0;outline:0;font-size:16px}
.search input::placeholder{color:var(--mut)}
nav.cats{position:sticky;top:0;z-index:10;padding:10px 0;margin:0 -16px;padding-inline:16px;background:linear-gradient(var(--bg) 70%,transparent);overflow-x:auto;display:flex;gap:8px;scrollbar-width:none}
nav.cats::-webkit-scrollbar{display:none}
nav.cats button{white-space:nowrap;padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--line);cursor:pointer;font-size:14.5px;transition:.2s}
nav.cats button.on{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:700}
h2.cat{font-family:'Reem Kufi';font-size:22px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h2.cat::after{content:"";flex:1;height:1px;background:linear-gradient(to left,transparent,var(--line))}
.item{display:flex;gap:14px;padding:12px;margin-bottom:12px;cursor:pointer;transition:transform .2s,border-color .2s;animation:up .4s both}
.item:active{transform:scale(.985)}
.item:hover{border-color:rgba(201,164,92,.4)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.thumb{width:92px;height:92px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:44px;background:linear-gradient(145deg,var(--c1,#2c4237),var(--c2,#1c2c25));border:1px solid var(--line);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.body{flex:1;min-width:0;display:flex;flex-direction:column}
.body b{font-size:17px;font-weight:700}
.body p{margin:4px 0 8px;color:var(--mut);font-size:13.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{color:var(--gold);font-weight:800;font-size:16px}.price small{font-weight:500;color:var(--mut);font-size:12px;margin-inline-start:3px}
.tag{font-size:11.5px;padding:3px 9px;border-radius:999px;background:rgba(201,164,92,.16);color:var(--gold)}
.out{opacity:.55}.out .tag{background:rgba(212,115,106,.18);color:var(--bad)}
footer{text-align:center;color:var(--mut);font-size:12.5px;margin:36px 0 10px}
footer a{color:var(--gold);text-decoration:none}
.fab{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:6px;padding:7px;border-radius:999px}
.fab button{border:0;background:none;padding:10px 18px;border-radius:999px;cursor:pointer;font-size:14px;color:var(--ink)}
.fab button.pri{background:var(--gold);color:#1a1408;font-weight:700}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,10,8,.6);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:rgba(23,37,31,.92);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:22px;animation:sheet .3s both}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-family:'Reem Kufi';font-size:22px;margin:0 0 6px}
.big{width:100%;height:170px;border-radius:18px;display:grid;place-items:center;font-size:80px;background:linear-gradient(145deg,var(--c1,#2c4237),var(--c2,#1c2c25));margin-bottom:14px;overflow:hidden}
.big img{width:100%;height:100%;object-fit:cover}
.btn{border:1px solid var(--line);background:var(--glass);padding:11px 18px;border-radius:14px;cursor:pointer}
.btn.pri{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:700}
.btn.del{color:var(--bad)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
.f{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);outline:0}
.f:focus{border-color:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.arow{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px}
.arow .t{flex:1;min-width:0}.arow .t b{display:block;font-size:15px}.arow .t span{font-size:12.5px;color:var(--mut)}
.sw{width:46px;height:27px;border-radius:99px;background:rgba(255,255,255,.15);position:relative;cursor:pointer;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on::after{right:22px}
.ib{border:1px solid var(--line);background:var(--glass);width:38px;height:38px;border-radius:12px;cursor:pointer;font-size:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.note{font-size:12.5px;color:var(--mut);line-height:1.7;padding:10px 12px;border-radius:12px;background:rgba(201,164,92,.08);border:1px dashed rgba(201,164,92,.35)}
.qrbox{background:#fff;padding:14px;border-radius:18px;display:inline-block}
.qrbox svg,.qrbox img{display:block;width:210px;height:210px}
.em{height:1.1em;width:1.1em;vertical-align:-.15em;display:inline-block}.thumb .em{height:46px;width:46px}.big .em{height:84px;width:84px}.ib .em,.arow .thumb .em{height:24px;width:24px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1408;padding:10px 18px;border-radius:99px;font-weight:700;z-index:99;display:none}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:none;cursor:pointer}
.tabs button.on{background:var(--gold);color:#1a1408;font-weight:700}
@media print{body{background:#fff;color:#000}.fab,.modal{display:none!important}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="wrap">
  <header class="hero">
    <div class="logo" id="logo">د</div>
    <h1 id="rname"></h1>
    <div class="sub" id="rtag"></div>
    <div class="info" id="rinfo"></div>
  </header>
  <div class="glass search"><span>🔍</span><input id="q" placeholder="ابحث عن أكلة..." autocomplete="off"></div>
  <nav class="cats" id="cats"></nav>
  <main id="list"></main>
  <footer>المنيو الرقمي • برمجة وتصميم: علي كاظم</footer>
</div>

<div class="fab glass" id="fab">
  <button class="pri" id="bQR">📱 رمز QR</button>
  <button id="bAdmin">⚙️ لوحة المطعم</button>
</div>

<div class="modal" id="mItem"><div class="sheet" id="sItem"></div></div>
<div class="modal" id="mQR"><div class="sheet" style="text-align:center">
  <h3>رمز المنيو (QR)</h3>
  <p class="sub">الزبون يمسحه بكاميرا الموبايل ويفتح المنيو مباشرة، بدون تحميل أي تطبيق.</p>
  <div class="qrbox" id="qrbox"></div>
  <div class="bar" style="justify-content:center"><button class="btn pri" id="qrDl">تحميل الصورة للطباعة</button><button class="btn" data-close>إغلاق</button></div>
</div></div>
<div class="modal" id="mAdmin"><div class="sheet" id="sAdmin"></div></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js"></script>
<script>
const KEY='menu-demo-v1',PIN='1234';
const DEFAULT={
 shop:{name:'مطعم دجلة',tag:'مأكولات عراقية أصيلة منذ ١٩٩٥',letter:'د',hours:'١٢ ظهراً - ١٢ منتصف الليل',phone:'07700000000',addr:'البصرة، شارع الكورنيش'},
 cats:[{id:'c1',name:'المقبلات'},{id:'c2',name:'الأطباق الرئيسية'},{id:'c3',name:'المشاوي'},{id:'c4',name:'المعجنات'},{id:'c5',name:'الحلويات'},{id:'c6',name:'المشروبات'}],
 items:[
 {id:'i1',cat:'c1',name:'حمص بالطحينة',desc:'حمص ناعم مع زيت الزيتون والبقدونس وخبز طازج.',price:3000,icon:'🥣',on:1,tag:''},
 {id:'i2',cat:'c1',name:'متبّل باذنجان',desc:'باذنجان مشوي بالطحينة والثوم وعصير الليمون.',price:3000,icon:'🍆',on:1,tag:''},
 {id:'i3',cat:'c1',name:'سلطة عراقية',desc:'خيار وطماطة وبصل وسماق وزيت زيتون.',price:2500,icon:'🥗',on:1,tag:''},
 {id:'i4',cat:'c1',name:'كبة حلب',desc:'قرص كبة مقرمش محشي باللحم والصنوبر. ٤ قطع.',price:5000,icon:'🧆',on:1,tag:'الأكثر طلباً'},
 {id:'i5',cat:'c2',name:'تشريب لحم',desc:'مرق لحم غني فوق خبز التنور مع الحمص والبصل.',price:9000,icon:'🍲',on:1,tag:'طبق الشيف'},
 {id:'i6',cat:'c2',name:'دولمة عراقية',desc:'ورق عنب وبصل وباذنجان محشي بالرز واللحم.',price:8000,icon:'🥬',on:1,tag:''},
 {id:'i7',cat:'c2',name:'برياني دجاج',desc:'رز بهارات مع الدجاج واللوز والزبيب.',price:8500,icon:'🍛',on:1,tag:''},
 {id:'i8',cat:'c2',name:'قوزي على الرز',desc:'لحم غنم مطبوخ ببطء فوق رز بالمكسرات.',price:15000,icon:'🍖',on:0,tag:''},
 {id:'i9',cat:'c3',name:'تكة لحم',desc:'مكعبات لحم غنم مشوية على الفحم مع بصل وطماطة.',price:12000,icon:'🍢',on:1,tag:''},
 {id:'i10',cat:'c3',name:'كباب عراقي',desc:'لحم مفروم متبل يشوى على الفحم، مع خبز وسلطة.',price:10000,icon:'🥩',on:1,tag:'الأكثر طلباً'},
 {id:'i11',cat:'c3',name:'سمك مسكوف',desc:'سمك شبوط من دجلة مشوي على الطريقة البغدادية.',price:22000,icon:'🐟',on:1,tag:'يحتاج ٤٥ دقيقة'},
 {id:'i12',cat:'c3',name:'مشاوي مشكلة',desc:'تكة وكباب وربع دجاج مع مقبلات للشخصين.',price:28000,icon:'🍗',on:1,tag:'يكفي شخصين'},
 {id:'i13',cat:'c4',name:'لحم بعجين',desc:'عجينة رقيقة بلحم متبل تخبز بالفرن.',price:4500,icon:'🍕',on:1,tag:''},
 {id:'i14',cat:'c4',name:'صمون حار',desc:'صمون عراقي ساخن مع جبن وبيض.',price:3500,icon:'🥖',on:1,tag:''},
 {id:'i15',cat:'c5',name:'كليچة',desc:'كليچة التمر التقليدية مع الشاي.',price:2000,icon:'🍪',on:1,tag:''},
 {id:'i16',cat:'c5',name:'زلابية وبقلاوة',desc:'حلويات شرقية بالقطر والمكسرات.',price:4500,icon:'🍯',on:1,tag:''},
 {id:'i17',cat:'c6',name:'شاي استكان',desc:'شاي عراقي بالهيل، يقدم بالاستكان.',price:1000,icon:'🍵',on:1,tag:''},
 {id:'i18',cat:'c6',name:'عصير ليمون بالنعناع',desc:'ليمون طازج ونعناع مع ثلج.',price:3000,icon:'🍋',on:1,tag:''},
 {id:'i19',cat:'c6',name:'لبن عيران',desc:'لبن بارد مملح، المشروب المثالي للمشاوي.',price:1500,icon:'🥛',on:1,tag:''},
 {id:'i20',cat:'c6',name:'مشروب غازي',desc:'علبة بحسب المتوفر.',price:1000,icon:'🥤',on:1,tag:''}
 ]};
let D=load(),cur='all',adm=false,edit=null,tab='items';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(DEFAULT)}catch(e){return structuredClone(DEFAULT)}}
function save(){localStorage.setItem(KEY,JSON.stringify(D))}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('ar-IQ');
const pal=[['#35503f','#1f3128'],['#4a3d2a','#2a2218'],['#3a3f55','#212437'],['#53403a','#2f2420'],['#2f4a4d','#1b2d2f']];
const colors=i=>{const p=pal[i%5];return `--c1:${p[0]};--c2:${p[1]}`};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2000)}
function pic(it){return it.img?`<img src="${esc(it.img)}" alt="">`:esc(it.icon||'🍽️')}

function render(){
 $('#rname').textContent=D.shop.name;$('#rtag').textContent=D.shop.tag;$('#logo').textContent=D.shop.letter||D.shop.name[0];
 document.title='منيو رقمي | '+D.shop.name;
 $('#rinfo').innerHTML=[D.shop.hours&&'🕐 '+D.shop.hours,D.shop.addr&&'📍 '+D.shop.addr,D.shop.phone&&`<a href="tel:${esc(D.shop.phone)}" style="color:inherit;text-decoration:none">📞 ${esc(D.shop.phone)}</a>`].filter(Boolean).map(x=>`<span class="chip glass">${x.startsWith('<')?x:esc(x)}</span>`).join('');
 const q=$('#q').value.trim();
 $('#cats').innerHTML=[{id:'all',name:'الكل'},...D.cats].map(c=>`<button class="${cur===c.id?'on':''}" data-cat="${c.id}">${esc(c.name)}</button>`).join('');
 let html='',n=0;
 for(const c of D.cats){
  if(cur!=='all'&&cur!==c.id)continue;
  const its=D.items.filter(i=>i.cat===c.id&&(!q||(i.name+i.desc).includes(q)));
  if(!its.length)continue;
  html+=`<h2 class="cat" id="cat-${c.id}">${esc(c.name)}</h2>`;
  its.forEach((i,k)=>{n++;html+=`<div class="item glass ${i.on?'':'out'}" data-id="${i.id}" style="animation-delay:${k*40}ms"><div class="thumb" style="${colors(n)}">${pic(i)}</div><div class="body"><b>${esc(i.name)}</b><p>${esc(i.desc)}</p><div class="row"><span class="price">${fmt(i.price)}<small>د.ع</small></span>${i.on?(i.tag?`<span class="tag">${esc(i.tag)}</span>`:''):'<span class="tag">غير متوفر حالياً</span>'}</div></div></div>`});
 }
 $('#list').innerHTML=html||'<div class="empty">ما لقينا أكلة بهذا الاسم</div>';
}
function openItem(id){
 const i=D.items.find(x=>x.id===id);if(!i)return;
 $('#sItem').innerHTML=`<div class="big" style="${colors(+id.slice(1))}">${pic(i)}</div><h3>${esc(i.name)}</h3><p class="sub" style="line-height:1.8;font-size:15px">${esc(i.desc)}</p><div class="row" style="margin:16px 0"><span class="price" style="font-size:24px">${fmt(i.price)}<small>دينار</small></span>${i.on?(i.tag?`<span class="tag">${esc(i.tag)}</span>`:''):'<span class="tag" style="color:var(--bad)">غير متوفر حالياً</span>'}</div><button class="btn" data-close style="width:100%">إغلاق</button>`;
 $('#mItem').classList.add('show');
}
function qrSvg(url,px){const q=qrcode(0,'M');q.addData(url);q.make();return q.createSvgTag({cellSize:6,margin:0,scalable:true})}
function openQR(){
 const url=location.href.split('#')[0];
 $('#qrbox').innerHTML=qrSvg(url);
 $('#mQR').classList.add('show');
}
$('#qrDl').onclick=()=>{
 const svg=$('#qrbox svg');const xml=new XMLSerializer().serializeToString(svg);
 const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=900;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,900,900);x.drawImage(img,60,60,780,780);const a=document.createElement('a');a.download='menu-qr.png';a.href=c.toDataURL('image/png');a.click()};
 img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
};
/* ---------- admin ---------- */
function openAdmin(){
 if(!adm){
  $('#sAdmin').innerHTML=`<h3>لوحة المطعم</h3><p class="sub">أدخل الرمز السري للدخول.</p><input class="f" id="pin" type="password" inputmode="numeric" placeholder="الرمز السري" autofocus><div class="note" style="margin-top:12px">نسخة تجريبية: الرمز <b>1234</b></div><div class="bar"><button class="btn pri" id="pinGo">دخول</button><button class="btn" data-close>إلغاء</button></div>`;
  $('#mAdmin').classList.add('show');
  $('#pinGo').onclick=()=>{if($('#pin').value===PIN){adm=true;adminView()}else toast('الرمز غير صحيح')};
  $('#pin').onkeydown=e=>{if(e.key==='Enter')$('#pinGo').click()};
 }else{adminView();$('#mAdmin').classList.add('show')}
}
function adminView(){
 const h=`<div class="row" style="margin-bottom:12px"><h3 style="margin:0">لوحة المطعم</h3><button class="btn" data-close>إغلاق</button></div>
 <div class="tabs"><button data-tab="items" class="${tab==='items'?'on':''}">الأصناف</button><button data-tab="cats" class="${tab==='cats'?'on':''}">الأقسام</button><button data-tab="shop" class="${tab==='shop'?'on':''}">المطعم</button></div>`;
 let b='';
 if(edit){b=itemForm()}
 else if(tab==='items'){
  b=`<button class="btn pri" id="addItem" style="width:100%">＋ إضافة صنف</button><div style="margin-top:12px">`+D.items.map(i=>`<div class="arow glass"><div class="thumb" style="width:46px;height:46px;font-size:24px;border-radius:12px;${colors(+i.id.slice(1)||0)}">${pic(i)}</div><div class="t"><b>${esc(i.name)}</b><span>${fmt(i.price)} د.ع</span></div><div class="sw ${i.on?'on':''}" data-sw="${i.id}" title="متوفر"></div><button class="ib" data-edit="${i.id}">✏️</button></div>`).join('')+`</div><div class="note">المفتاح الأخضر يعني الصنف متوفر. اطفيه إذا خلص الصنف وبثواني يختفي السعر ويظهر "غير متوفر" للزبون.</div>
  <div class="bar"><button class="btn" id="exp">⬇️ حفظ نسخة</button><button class="btn" id="imp">⬆️ استرجاع نسخة</button><button class="btn del" id="rst">إعادة الأصل</button></div><input type="file" id="file" accept=".json" hidden>`;
 }else if(tab==='cats'){
  b=D.cats.map((c,k)=>`<div class="arow glass"><input class="f" data-cn="${c.id}" value="${esc(c.name)}"><button class="ib" data-up="${k}">↑</button><button class="ib" data-cd="${c.id}">🗑</button></div>`).join('')+`<div class="bar"><input class="f" id="ncat" placeholder="اسم قسم جديد" style="flex:1"><button class="btn pri" id="addCat">إضافة</button></div>`;
 }else{
  const s=D.shop;
  b=[['name','اسم المطعم'],['tag','وصف قصير'],['letter','حرف الشعار'],['hours','أوقات الدوام'],['addr','العنوان'],['phone','رقم الهاتف']].map(([k,l])=>`<label>${l}</label><input class="f" data-sk="${k}" value="${esc(s[k])}">`).join('')+`<div class="bar"><button class="btn pri" id="saveShop">حفظ</button></div>`;
 }
 $('#sAdmin').innerHTML=h+b;
}
function itemForm(){
 const i=edit==='new'?{id:'',cat:D.cats[0]?.id,name:'',desc:'',price:'',icon:'🍽️',on:1,tag:''}:D.items.find(x=>x.id===edit);
 return `<label>اسم الصنف</label><input class="f" id="fn" value="${esc(i.name)}"><label>الوصف</label><textarea class="f" id="fd" rows="3">${esc(i.desc)}</textarea>
 <div class="grid2"><div><label>السعر (دينار)</label><input class="f" id="fp" type="number" inputmode="numeric" value="${esc(i.price)}"></div><div><label>القسم</label><select class="f" id="fc">${D.cats.map(c=>`<option value="${c.id}" ${c.id===i.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div>
 <div class="grid2"><div><label>أيقونة (إيموجي)</label><input class="f" id="fi" value="${esc(i.icon)}"></div><div><label>شارة (اختياري)</label><input class="f" id="ft" value="${esc(i.tag)}" placeholder="مثل: الأكثر طلباً"></div></div>
 <label>رابط صورة (اختياري)</label><input class="f" id="fimg" value="${esc(i.img||'')}" placeholder="https://...">
 <div class="bar"><button class="btn pri" id="saveItem">حفظ</button><button class="btn" id="cancel">رجوع</button>${edit!=='new'?'<button class="btn del" id="delItem">حذف الصنف</button>':''}</div>`;
}
document.addEventListener('click',e=>{
 const t=e.target.closest('button,.item,.sw,.modal');if(!t)return;
 if(t.classList.contains('modal')&&e.target===t){t.classList.remove('show');return}
 if(t.dataset.close!==undefined){t.closest('.modal').classList.remove('show');return}
 if(t.dataset.cat){cur=t.dataset.cat;render();return}
 if(t.classList.contains('item')){openItem(t.dataset.id);return}
 if(t.id==='bQR')return openQR();
 if(t.id==='bAdmin')return openAdmin();
 if(t.dataset.tab){tab=t.dataset.tab;edit=null;adminView();return}
 if(t.dataset.sw){const i=D.items.find(x=>x.id===t.dataset.sw);i.on=i.on?0:1;save();render();adminView();return}
 if(t.dataset.edit){edit=t.dataset.edit;adminView();return}
 if(t.id==='addItem'){edit='new';adminView();return}
 if(t.id==='cancel'){edit=null;adminView();return}
 if(t.id==='saveItem'){
  const v=id=>$(id).value.trim();if(!v('#fn')||!v('#fp'))return toast('اكتب الاسم والسعر');
  const o={name:v('#fn'),desc:v('#fd'),price:+v('#fp'),cat:$('#fc').value,icon:v('#fi')||'🍽️',tag:v('#ft'),img:v('#fimg')};
  if(edit==='new')D.items.push({id:'i'+Date.now().toString(36),on:1,...o});else Object.assign(D.items.find(x=>x.id===edit),o);
  edit=null;save();render();adminView();toast('تم الحفظ ✓');return}
 if(t.id==='delItem'){if(confirm('حذف هذا الصنف؟')){D.items=D.items.filter(x=>x.id!==edit);edit=null;save();render();adminView()}return}
 if(t.dataset.cd){if(D.items.some(i=>i.cat===t.dataset.cd))return toast('انقل أصناف القسم أو احذفها أولاً');D.cats=D.cats.filter(c=>c.id!==t.dataset.cd);save();render();adminView();return}
 if(t.dataset.up){const k=+t.dataset.up;if(k>0){[D.cats[k-1],D.cats[k]]=[D.cats[k],D.cats[k-1]];save();render();adminView()}return}
 if(t.id==='addCat'){const n=$('#ncat').value.trim();if(n){D.cats.push({id:'c'+Date.now().toString(36),name:n});save();render();adminView()}return}
 if(t.id==='saveShop'){document.querySelectorAll('[data-sk]').forEach(x=>D.shop[x.dataset.sk]=x.value.trim());save();render();toast('تم الحفظ ✓');return}
 if(t.id==='exp'){const a=document.createElement('a');a.download='menu-backup.json';a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.click();return}
 if(t.id==='imp')return $('#file').click();
 if(t.id==='rst'){if(confirm('إرجاع المنيو للنسخة الأصلية؟')){D=structuredClone(DEFAULT);save();render();adminView()}return}
});
document.addEventListener('change',e=>{
 if(e.target.dataset.cn){D.cats.find(c=>c.id===e.target.dataset.cn).name=e.target.value;save();render()}
 if(e.target.id==='file'){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.items&&j.cats&&j.shop){D=j;save();render();adminView();toast('تم الاسترجاع ✓')}else throw 0}catch(_){toast('الملف غير صالح')}};r.readAsText(e.target.files[0])}
});
$('#q').oninput=render;
if(location.hash==='#admin')openAdmin();
render();
/* twemoji-style emoji images so icons look the same on every phone */
const EM=/(\p{Extended_Pictographic}\uFE0F?(?:\u200D\p{Extended_Pictographic}\uFE0F?)*)/gu;
function T(root){
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const ns=[];
 while(w.nextNode())ns.push(w.currentNode);
 ns.forEach(n=>{
  if(!EM.test(n.nodeValue)){EM.lastIndex=0;return}EM.lastIndex=0;
  if(n.parentNode.closest('input,textarea,select,script,style'))return;
  const f=document.createDocumentFragment();
  n.nodeValue.split(EM).forEach(p=>{
   if(!p)return;EM.lastIndex=0;
   if(EM.test(p)){EM.lastIndex=0;const cp=[...p].map(c=>c.codePointAt(0).toString(16)).filter(x=>x!=='fe0f').join('-');
    const im=document.createElement('img');im.src='https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/'+cp+'.svg';im.alt=p;im.className='em';im.onerror=()=>{im.replaceWith(document.createTextNode(p))};f.appendChild(im)}
   else f.appendChild(document.createTextNode(p));
  });
  n.parentNode.replaceChild(f,n);
 });
}
let busy=0;new MutationObserver(m=>{if(busy)return;busy=1;m.forEach(r=>r.addedNodes.forEach(n=>{if(n.nodeType===1)T(n);else if(n.nodeType===3&&n.parentNode)T(n.parentNode)}));busy=0}).observe(document.body,{childList:true,subtree:true});
T(document.body);

</script>
